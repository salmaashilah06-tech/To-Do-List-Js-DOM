<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To do list</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="toDo">
        <h1>My To Do List Calma 💐 <img src="images/icon.png" /></h1>
        <div class="row">
          <input
            type="text"
            id="inputTask"
            placeholder="Tambahkan to do list"
          />
          <button id="tombol">tambah</button>
        </div>
        <ul id="listContainer"></ul>
        <div class="stats">
          <p>Total Tugas: <span id="totalCount">0</span></p>
          <p>Selesai: <span id="doneCount">0</span></p>
          <p>Belum Selesai: <span id="pendingCount">0</span></p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
